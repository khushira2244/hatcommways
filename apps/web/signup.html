<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account — Hatcommways</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./auth.css"></head>
<body class="auth-page"><div class="page-shell"><header class="site-header"><a class="brand" href="./index.html" aria-label="Hatcommways home"><img class="brand-logo" src="./hatcommways-logo.png" alt="Hatcommways" /></a><a class="header-link" href="./signin.html">Sign in</a></header>
<main class="auth-main"><section class="auth-card" aria-labelledby="signup-title"><h1 id="signup-title">Create your account</h1><p class="auth-card__intro">Start organizing or supporting meaningful community action.</p><form class="auth-form" id="signup-form"><div class="field"><label for="display-name">Display name</label><input id="display-name" name="display_name" autocomplete="name" maxlength="200" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="320" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="1024" required><p class="field-hint">Use at least 10 characters.</p></div><fieldset><legend class="fieldset-title">Account type</legend><div class="account-options"><div class="account-option"><input id="individual" type="radio" name="account_type" value="INDIVIDUAL" checked><label for="individual"><strong>Individual</strong><span>For people organizing, joining, or supporting community activities.</span></label></div><div class="account-option"><input id="organization" type="radio" name="account_type" value="ORGANIZATION"><label for="organization"><strong>Organization</strong><span>For organizations creating, supporting, or sponsoring community activities.</span></label></div></div></fieldset><p id="form-message" class="form-message" role="alert"></p><button class="button button--primary auth-submit" type="submit">Create account</button></form><p class="auth-card__footer">Already have an account? <a href="./signin.html">Sign in</a></p></section></main></div><script src="./auth.js?v=20260911-home" defer></script></body></html>

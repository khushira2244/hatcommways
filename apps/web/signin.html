<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in — Hatcommways</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./auth.css"></head>
<body class="auth-page"><div class="page-shell"><header class="site-header"><a class="brand" href="./index.html" aria-label="Hatcommways home"><svg class="brand__mark" viewBox="0 0 44 44" aria-hidden="true"><path d="M22 5.5 35.7 13v16L22 36.5 8.3 29V13L22 5.5Z"/><circle cx="22" cy="13" r="4.2"/><circle cx="14.5" cy="25.6" r="4.2"/><circle cx="29.5" cy="25.6" r="4.2"/></svg><span>Hatcommways</span></a><a class="header-link" href="./signin.html" aria-current="page">Sign in</a></header><main class="auth-main"><section class="auth-card" aria-labelledby="signin-title"><h1 id="signin-title">Welcome back</h1><p class="auth-card__intro">Sign in to organize and coordinate your community work.</p><form class="auth-form" id="signin-form"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="320" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required></div><p id="form-message" class="form-message" role="alert"></p><button class="button button--primary auth-submit" type="submit">Sign in</button></form><p class="auth-card__footer">New to Hatcommways? <a href="./signup.html">Create an account</a></p></section></main></div><script src="./auth.js" defer></script></body></html>
